services:
  lcars:
    build: .
    container_name: lcars-dashboard
    restart: unless-stopped
    # Share the server's network directly, so the dashboard sees the real eno1
    # traffic for the network graph. It listens on PORT from .env (8088).
    network_mode: host
    # Tokens and addresses live in .env (kept private, not baked into the image)
    env_file: .env
    volumes:
      # Read-only view of the server's disk, so the DISK meter shows the host, not the container
      - /:/host:ro
